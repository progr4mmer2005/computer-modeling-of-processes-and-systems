<style>
:root {
  --bg: #fbfaf7; --text: #1d1d1f; --muted: #5d5d63; --line: #e3e0d8;
  --card: #ffffff; --accent: #1f5fae; --say-bg: #eef5ec; --say-line: #3f8a3a;
  --warn-bg: #fdf3e4; --warn-line: #c27c0e; --code-bg: #f1efe9;
  --why-bg: #eef2fa; --why-line: #4a6fb5; --ex-bg: #f6f1fa; --ex-line: #8a5bb5;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #17181b; --text: #e8e6e1; --muted: #a3a19c; --line: #34353a;
    --card: #1f2024; --accent: #7fb0f0; --say-bg: #1d2a1c; --say-line: #6fbf68;
    --warn-bg: #2d2416; --warn-line: #e0a54a; --code-bg: #26272b;
    --why-bg: #1c2230; --why-line: #7f9fe0; --ex-bg: #261f2d; --ex-line: #b48ae0;
  }
}
:root[data-theme="dark"] {
  --bg: #17181b; --text: #e8e6e1; --muted: #a3a19c; --line: #34353a;
  --card: #1f2024; --accent: #7fb0f0; --say-bg: #1d2a1c; --say-line: #6fbf68;
  --warn-bg: #2d2416; --warn-line: #e0a54a; --code-bg: #26272b;
  --why-bg: #1c2230; --why-line: #7f9fe0; --ex-bg: #261f2d; --ex-line: #b48ae0;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 17px/1.65 "Segoe UI", system-ui, -apple-system, sans-serif; }
main { max-width: 880px; margin: 0 auto; padding: 32px 16px 100px; }
h1 { font-size: 30px; line-height: 1.2; margin: 0 0 6px; }
h2 { font-size: 24px; margin: 56px 0 12px; padding-top: 14px; border-top: 2px solid var(--line); }
h3 { font-size: 19px; margin: 30px 0 8px; }
p, li { max-width: 74ch; }
a { color: var(--accent); }
a.t { text-decoration: none; border-bottom: 1px dotted var(--accent); }
.sub { color: var(--muted); margin: 0 0 24px; }
nav { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px 18px; }
nav ol, nav ul.toc { margin: 6px 0 0; padding-left: 22px; }
nav ul.toc { list-style: none; padding-left: 4px; }
nav a { text-decoration: none; }
.say, .warn, .why, .ex { padding: 12px 16px; border-radius: 0 8px 8px 0; margin: 16px 0;
  border-left: 4px solid; }
b.lbl { display: block; font-size: 12.5px; text-transform: uppercase; letter-spacing: .07em;
  margin-bottom: 6px; }
.say { background: var(--say-bg); border-color: var(--say-line); }
.say > b.lbl { color: var(--say-line); }
.warn { background: var(--warn-bg); border-color: var(--warn-line); }
.warn > b.lbl { color: var(--warn-line); }
.why { background: var(--why-bg); border-color: var(--why-line); }
.why > b.lbl { color: var(--why-line); }
.why p { margin: 6px 0; }
.why .q { font-weight: 700; }
.ex { background: var(--ex-bg); border-color: var(--ex-line); }
.ex > b.lbl { color: var(--ex-line); }
.f { font-family: "Cambria Math", "Times New Roman", serif; font-size: 19px; background: var(--code-bg);
  padding: 8px 14px; border-radius: 6px; margin: 10px 0; overflow-x: auto; white-space: nowrap; }
code { font-family: Consolas, monospace; background: var(--code-bg); padding: 1px 5px; border-radius: 4px; font-size: 15px; }
table { border-collapse: collapse; width: 100%; margin: 12px 0; font-size: 15px; display: block; overflow-x: auto; }
th, td { border: 1px solid var(--line); padding: 6px 10px; text-align: left; vertical-align: top; }
th { font-weight: 700; }
details { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; margin: 8px 0; }
summary { cursor: pointer; font-weight: 600; }
details[open] summary { margin-bottom: 8px; }
dl.gl dt { font-weight: 700; margin-top: 16px; scroll-margin-top: 12px; }
dl.gl dd { margin: 4px 0 0 0; padding-left: 14px; border-left: 2px solid var(--line); }
dl.gl dt:target { background: var(--why-bg); }
.num { font-variant-numeric: tabular-nums; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 6px 18px; margin: 14px 0; }
.card p { margin: 8px 0; }
figure { margin: 16px 0; }
figure img { display: block; max-width: 100%; height: auto; border: 1px solid var(--line); border-radius: 6px; background: #fff; }
figcaption { font-size: 14px; color: var(--muted); margin-top: 6px; }
.ex table { font-size: 14px; }
</style>
